{{define "assets/info-collect"}}
<div id="page-info-collect" class="page">
                    <div class="page-header">
                        <h2 data-i18n="infoCollectPage.title">信息收集</h2>
                        <div class="page-header-actions">
                            <button class="btn-secondary" onclick="resetFofaForm()" data-i18n="infoCollectPage.reset">重置</button>
                            <button class="btn-primary" data-require-permission="fofa:execute" onclick="submitFofaSearch()" data-i18n="infoCollectPage.confirm">确定</button>
                        </div>
                    </div>
                    <div class="page-content">
                        <div class="info-collect-panel">
                            <div class="info-collect-form">
                                <div class="info-collect-form-top">
                                    <div class="info-collect-provider-card form-group">
                                        <div class="info-collect-step-title">
                                            <span>01</span>
                                            <label for="fofa-provider">数据源</label>
                                        </div>
                                        <select id="fofa-provider" onchange="handleInfoCollectProviderChange()">
                                            <option value="fofa">FOFA</option>
                                            <option value="zoomeye">ZoomEye</option>
                                            <option value="quake">Quake</option>
                                            <option value="shodan">Shodan</option>
                                        </select>
                                        <small class="form-hint">支持 FOFA、ZoomEye、Quake、Shodan；API Key 可在系统设置或环境变量中配置。</small>
                                    </div>
                                    <div class="info-collect-query-card form-group">
                                        <div class="info-collect-step-title">
                                            <span>02</span>
                                            <div>查询方式</div>
                                        </div>
                                        <div id="info-collect-natural-panel" class="info-collect-query-mode-panel info-collect-natural-panel">
                                            <label for="fofa-nl" id="info-collect-nl-label" class="info-collect-inner-label">自然语言（可选，AI 解析为查询语法）</label>
                                            <div class="info-collect-nl-row">
                                                <textarea id="fofa-nl" class="info-collect-query-input" rows="1" placeholder="例如：找中国的 Apache 站点"></textarea>
                                                <button id="fofa-nl-parse-btn" class="btn-secondary" type="button" onclick="parseFofaNaturalLanguage()" data-i18n="infoCollectPage.parseBtn" data-i18n-attr="title" data-i18n-title="infoCollectPage.parseBtnTitle" title="将自然语言解析为 FOFA 查询语法">AI 解析</button>
                                            </div>
                                            <div id="fofa-nl-status" class="fofa-nl-status muted" style="display: none;" aria-live="polite"></div>
                                            <small class="form-hint" id="info-collect-parse-hint">解析后会弹窗展示对应数据源语法（可编辑），确认无误后再填入查询框并执行查询。</small>
                                        </div>
                                        <div id="info-collect-syntax-panel" class="info-collect-query-mode-panel is-active">
                                            <label for="fofa-query" id="info-collect-query-label" class="info-collect-inner-label">查询语法（可编辑，可直接查询）</label>
                                            <div class="info-collect-query-row">
                                                <textarea id="fofa-query" class="info-collect-query-input" rows="1" placeholder='例如：app="Apache" && country="CN"'></textarea>
                                                <button id="fofa-query-submit-btn" class="btn-primary" data-require-permission="fofa:execute" type="button" onclick="submitFofaSearch()">查询</button>
                                            </div>
                                            <small class="form-hint" id="info-collect-query-hint">选择数据源后会显示对应查询语法提示。</small>
                                            <div class="info-collect-presets" id="info-collect-query-presets" aria-label="查询示例"></div>
                                            <div class="info-collect-syntax-guide" id="info-collect-syntax-guide" hidden></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="info-collect-options-card">
                                    <div class="info-collect-step-title">
                                        <span>03</span>
                                        <div>返回配置</div>
                                    </div>
                                    <div class="info-collect-form-row">
                                        <div class="form-group">
                                            <label for="fofa-size" data-i18n="infoCollectPage.returnCount">返回数量</label>
                                            <input type="number" id="fofa-size" min="1" max="10000" value="100" />
                                        </div>
                                        <div class="form-group">
                                            <label for="fofa-page" data-i18n="infoCollectPage.pageNum">页码</label>
                                            <input type="number" id="fofa-page" min="1" value="1" />
                                        </div>
                                        <div class="form-group" id="info-collect-full-option">
                                            <label class="checkbox-label">
                                                <input type="checkbox" id="fofa-full" class="modern-checkbox" />
                                                <span class="checkbox-custom"></span>
                                                <span class="checkbox-text" data-i18n="infoCollectPage.fullLabel">full</span>
                                            </label>
                                        </div>
                                        <small class="form-hint info-collect-row-hint" id="info-collect-size-hint">不同数据源的单次返回上限可能不同。</small>
                                    </div>
                                </div>
                                <div class="info-collect-fields-card form-group">
                                    <div class="info-collect-step-title">
                                        <span>04</span>
                                        <label for="fofa-fields" data-i18n="infoCollectPage.returnFields">返回字段名（逗号分隔）</label>
                                    </div>
                                    <input type="text" id="fofa-fields" value="host,ip,port,domain,title,protocol,country,region,city,server" />
                                    <div class="info-collect-presets" id="info-collect-fields-presets" aria-label="字段模板"></div>
                                </div>
                            </div>
                        </div>

                        <div class="info-collect-results">
                            <div class="info-collect-results-header">
                                <div class="info-collect-results-header-left">
                                    <div class="info-collect-results-title" data-i18n="infoCollectPage.queryResults">查询结果</div>
                                    <div class="info-collect-results-meta" id="fofa-results-meta">-</div>
                                </div>
                                <div class="info-collect-results-toolbar" aria-label="结果工具条" data-i18n="infoCollectPage.resultsToolbarAria" data-i18n-attr="aria-label" data-i18n-skip-text="true">
                                    <div class="info-collect-selected" id="fofa-selected-meta" data-i18n="infoCollectPage.selectedRowsZero">已选择 0 条</div>
                                    <button class="btn-secondary btn-small" type="button" onclick="toggleFofaColumnsPanel()" data-i18n="infoCollectPage.showHideColumns" data-i18n-attr="title" title="显示/隐藏字段"><span data-i18n="infoCollectPage.columns">列</span></button>
                                    <button class="btn-secondary btn-small" type="button" data-require-permission="fofa:execute" onclick="exportFofaResults('csv')" data-i18n="infoCollectPage.exportCsvTitle" data-i18n-attr="title" title="导出当前结果为 CSV（UTF-8，兼容中文）"><span data-i18n="infoCollectPage.exportCsv">导出 CSV</span></button>
                                    <button class="btn-secondary btn-small" type="button" data-require-permission="fofa:execute" onclick="exportFofaResults('json')" data-i18n="infoCollectPage.exportJsonTitle" data-i18n-attr="title" title="导出当前结果为 JSON"><span data-i18n="infoCollectPage.exportJson">导出 JSON</span></button>
                                    <button class="btn-secondary btn-small" type="button" data-require-permission="fofa:execute" onclick="exportFofaResults('xlsx')" data-i18n="infoCollectPage.exportXlsxTitle" data-i18n-attr="title" title="导出当前结果为 Excel"><span data-i18n="infoCollectPage.exportXlsx">导出 XLSX</span></button>
                                    <button class="btn-secondary btn-small" data-require-permission="asset:write" type="button" onclick="importSelectedFofaAssets()" data-i18n="assets.importSelected">入库所选</button>
                                    <button class="btn-primary btn-small" data-require-permission="fofa:execute" type="button" onclick="batchScanSelectedFofaRows()" data-i18n="infoCollectPage.batchScanTitle" data-i18n-attr="title" title="将所选行创建为批量任务队列"><span data-i18n="infoCollectPage.batchScan">批量扫描</span></button>
                                </div>
                            </div>
                            <div class="info-collect-results-table-wrap">
                                <!-- 字段显示/隐藏面板 -->
                                <div id="fofa-columns-panel" class="info-collect-columns-panel" style="display: none;">
                                    <div class="info-collect-columns-panel-header">
                                        <div class="info-collect-columns-title" data-i18n="infoCollectPage.showColumns">显示字段</div>
                                        <div class="info-collect-columns-actions">
                                            <button class="btn-secondary btn-small" type="button" onclick="showAllFofaColumns()" data-i18n="infoCollectPage.columnsPanelAll">全选</button>
                                            <button class="btn-secondary btn-small" type="button" onclick="hideAllFofaColumns()" data-i18n="infoCollectPage.columnsPanelNone">全不选</button>
                                            <button class="btn-secondary btn-small" type="button" onclick="closeFofaColumnsPanel()" data-i18n="infoCollectPage.columnsPanelClose">关闭</button>
                                        </div>
                                    </div>
                                    <div id="fofa-columns-list" class="info-collect-columns-list"></div>
                                </div>
                                <table class="info-collect-table">
                                    <thead id="fofa-results-thead"></thead>
                                    <tbody id="fofa-results-tbody">
                                        <tr><td class="muted" style="padding: 16px;" data-i18n="common.noData">暂无数据</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
{{end}}
