{{define "chat/page"}}
<div id="page-chat" class="page">
                    <div class="chat-page-layout">
                        <!-- 历史对话侧边栏（可折叠，与主导航侧边栏类似） -->
                        <aside class="conversation-sidebar" id="conversation-sidebar">
                            <!-- 头部一行：折叠与「新任务」并排；任务底层复用会话数据 -->
                            <div class="sidebar-header conversation-sidebar-header">
                                <button type="button" class="new-chat-btn" data-require-permission="chat:write" onclick="startNewConversation()">
                                    <span>+</span> <span data-i18n="chat.newTask">新任务</span>
                                </button>
                                <button type="button" class="conversation-sidebar-collapse-btn" onclick="toggleConversationSidebar()" data-i18n="chat.toggleConversationPanel" data-i18n-attr="title" data-i18n-skip-text="true" title="折叠/展开对话列表" aria-label="折叠/展开对话列表">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="sidebar-content">
                                <!-- 项目搜索 -->
                                <div class="conversation-search-box">
                                    <input type="text" id="conversation-search-input" data-i18n="projects.searchProjectsPlaceholder" data-i18n-attr="placeholder" placeholder="搜索项目…"
                                           oninput="handleProjectFolderSearch(this.value)"
                                           onkeypress="if(event.key === 'Enter') handleProjectFolderSearch(this.value)" />
                                    <button class="conversation-search-clear" id="conversation-search-clear" 
                                            onclick="clearProjectFolderSearch()" style="display: none;" data-i18n="common.clearSearch" data-i18n-attr="title" title="清除搜索">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                            <circle cx="8" cy="8" r="7" fill="currentColor" fill-opacity="0.2"/>
                                            <path d="M5.25 5.25l5.5 5.5M10.75 5.25l-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                        </svg>
                                    </button>
                                </div>

                                <!-- 项目文件夹：复用对话底部项目选择器的真实项目数据 -->
                                <section class="project-folders-section" aria-labelledby="project-folders-title">
                                    <div class="section-header project-folders-header">
                                        <span id="project-folders-title" class="section-title" data-i18n="chat.projectFolders">项目</span>
                                        <button type="button" class="add-group-btn project-folders-add-btn" data-require-permission="project:write" onclick="showNewProjectModalFromChatSidebar()" data-i18n="projects.newProject" data-i18n-attr="title,aria-label" data-i18n-skip-text="true" title="新建项目" aria-label="新建项目">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <div id="project-folders-list" class="project-folders-list"></div>
                                </section>

                                <!-- 按项目筛选对话 -->
                                <div class="conversation-project-filter" hidden>
                                    <label class="conversation-project-filter-label" for="conversation-project-filter" data-i18n="chat.filterByProject">按项目筛选</label>
                                    <select id="conversation-project-filter" class="conversation-project-filter-native" onchange="onConversationProjectFilterChange(this.value)" data-i18n="chat.filterByProject" data-i18n-attr="title" title="按项目筛选">
                                        <option value="" data-i18n="chat.filterAllProjects">全部项目</option>
                                        <option value="__none__" data-i18n="chat.filterUnboundProjects">未绑定项目</option>
                                    </select>
                                </div>
                                
                                <!-- 最近对话 -->
                                <div class="recent-conversations-section is-collapsed" id="recent-conversations-section">
                                    <button type="button" class="section-header recent-conversations-toggle" id="recent-conversations-toggle" onclick="toggleRecentConversations()" aria-expanded="false" aria-controls="recent-conversations-body" data-i18n="chat.toggleRecentConversations" data-i18n-attr="title,aria-label" data-i18n-skip-text="true" title="展开/折叠最近对话" aria-label="展开/折叠最近对话">
                                        <span class="section-title" data-i18n="chat.recentConversations">最近对话</span>
                                        <span class="recent-conversations-toggle-meta">
                                            <span id="recent-conversations-count" class="recent-conversations-count">0</span>
                                            <svg class="recent-conversations-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        </span>
                                    </button>
                                    <div id="recent-conversations-body" class="recent-conversations-body" hidden>
                                        <div class="section-header-actions recent-conversations-actions">
                                            <div class="conversation-sort-dropdown" id="conversation-sort-dropdown">
                                                <button type="button" class="conversation-sort-btn" id="conversation-sort-btn" onclick="toggleConversationSortMenu(event)" aria-haspopup="menu" aria-expanded="false" aria-controls="conversation-sort-menu" data-i18n="chat.sortConversations" data-i18n-attr="title" data-i18n-skip-text="true" title="排序">
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                        <path d="M3 6h18M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                                    </svg>
                                                </button>
                                                <div class="conversation-sort-menu" id="conversation-sort-menu" role="menu" hidden>
                                                    <button type="button" class="conversation-sort-option" role="menuitemradio" data-sort="created_at" onclick="setConversationSortBy('created_at')">
                                                        <span class="conversation-sort-option-icon" aria-hidden="true">
                                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                                <rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
                                                                <path d="M3 10h18" stroke="currentColor" stroke-width="1.75"/>
                                                                <path d="M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                                                                <circle cx="12" cy="15" r="1.75" fill="currentColor"/>
                                                            </svg>
                                                        </span>
                                                        <span class="conversation-sort-option-label" data-i18n="chat.sortByCreatedAt">创建时间</span>
                                                        <span class="conversation-sort-option-check" aria-hidden="true">✓</span>
                                                    </button>
                                                    <button type="button" class="conversation-sort-option" role="menuitemradio" data-sort="updated_at" onclick="setConversationSortBy('updated_at')">
                                                        <span class="conversation-sort-option-icon" aria-hidden="true">
                                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.75"/>
                                                                <path d="M12 8v4.5l3 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                                                            </svg>
                                                        </span>
                                                        <span class="conversation-sort-option-label" data-i18n="chat.sortByUpdatedAt">更新时间</span>
                                                        <span class="conversation-sort-option-check" aria-hidden="true">✓</span>
                                                    </button>
                                                </div>
                                            </div>
                                            <button class="batch-manage-btn" data-require-permission="chat:delete" onclick="showBatchManageModal()" data-i18n="chat.batchManage" data-i18n-attr="title" data-i18n-skip-text="true" title="批量管理">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                                    <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                                    <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                                    <circle cx="8" cy="6" r="1" fill="currentColor"/>
                                                    <circle cx="8" cy="12" r="1" fill="currentColor"/>
                                                    <circle cx="8" cy="18" r="1" fill="currentColor"/>
                                                </svg>
                                            </button>
                                        </div>
                                        <div id="conversations-list" class="conversations-list"></div>
                                    </div>
                                </div>
                            </div>
                            <div id="conversations-pagination" class="sidebar-list-pagination conversation-sidebar-pagination"></div>
                            <div id="chat-reasoning-wrapper" class="chat-reasoning-wrapper conversation-reasoning-card conversation-reasoning-collapsed" style="display: none;">
                                <button type="button" id="conversation-reasoning-toggle" class="conversation-reasoning-card-header" onclick="toggleConversationReasoningCard()" aria-expanded="false" aria-controls="conversation-reasoning-body" data-i18n="chat.sessionSettingsAria" data-i18n-attr="aria-label,title" data-i18n-skip-text="true" aria-label="会话设置" title="会话设置">
                                    <div class="conversation-reasoning-heading">
                                        <span class="conversation-reasoning-icon" aria-hidden="true">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.75"/>
                                                <path d="M16 16l5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                                            </svg>
                                        </span>
                                        <div class="conversation-reasoning-heading-text">
                                            <span class="conversation-reasoning-title" data-i18n="chat.sessionSettingsTitle">会话设置</span>
                                            <span id="chat-reasoning-summary" class="conversation-reasoning-summary"></span>
                                        </div>
                                    </div>
                                    <span class="sidebar-card-chevron conversation-reasoning-chevron" aria-hidden="true">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                </button>
                                <div id="conversation-reasoning-body" class="conversation-reasoning-body" role="region">
                                    <p class="chat-reasoning-panel-hint" data-i18n="chat.sessionSettingsHint">人机协同设置只影响后续消息。</p>
                                    <div class="chat-reasoning-fields">
	                                        <div class="chat-reasoning-field session-hitl-field session-settings-group">
	                                            <div class="session-settings-group-title" data-i18n="chat.hitlTitle">人机协同</div>
	                                            <div id="hitl-apply-feedback" class="hitl-apply-feedback" role="status" aria-live="polite"></div>
	                                            <div class="hitl-sidebar-config session-hitl-config">
	                                                <div class="hitl-config-field">
	                                                    <label class="hitl-config-label" for="hitl-mode-select" data-i18n="chat.reasoningModeLabel">模式</label>
	                                                    <select id="hitl-mode-select" class="hitl-config-select">
	                                                        <option value="off" data-i18n="chat.hitlModeOff">关闭</option>
	                                                        <option value="approval" data-i18n="chat.hitlModeApproval">审批模式</option>
	                                                        <option value="review_edit" data-i18n="chat.hitlModeReviewEdit">审查编辑</option>
	                                                    </select>
	                                                </div>
	                                                <div class="hitl-config-field" id="hitl-reviewer-field">
	                                                    <label class="hitl-config-label" data-i18n="chat.hitlReviewerLabel">审批方</label>
	                                                    <div class="hitl-reviewer-toggle" role="group" aria-label="Reviewer">
	                                                        <button type="button" class="hitl-reviewer-toggle-btn is-active" data-reviewer="human" aria-pressed="true">
	                                                            <span data-i18n="chat.hitlReviewerHuman">人工审批</span>
	                                                        </button>
	                                                        <button type="button" class="hitl-reviewer-toggle-btn" data-reviewer="audit_agent" aria-pressed="false">
	                                                            <span data-i18n="chat.hitlReviewerAgent">审计 Agent</span>
	                                                        </button>
	                                                    </div>
	                                                    <input type="hidden" id="hitl-reviewer-select" value="human" />
	                                                    <p class="hitl-config-hint" data-i18n="chat.hitlReviewerHint">可在人工与审计 Agent 之间随时切换；规则与白名单不变。人机协同为「关闭」时也可预先选择。</p>
	                                                </div>
	                                                <div class="hitl-config-field" id="hitl-timeout-field">
	                                                    <label class="hitl-config-label" for="hitl-timeout-select" data-i18n="chat.hitlTimeoutLabel">审批等待时限</label>
	                                                    <select id="hitl-timeout-select" class="hitl-config-select">
	                                                        <option value="60" data-i18n="chat.hitlTimeoutOneMinute">1 分钟</option>
	                                                        <option value="300" selected data-i18n="chat.hitlTimeoutFiveMinutes">5 分钟</option>
	                                                        <option value="600" data-i18n="chat.hitlTimeoutTenMinutes">10 分钟</option>
	                                                        <option value="0" data-i18n="chat.hitlTimeoutUnlimited">不限制</option>
	                                                    </select>
	                                                    <p class="hitl-config-hint" data-i18n="chat.hitlTimeoutHint">到期未处理将自动拒绝；审批卡片会显示倒计时。</p>
	                                                </div>
	                                                <div class="hitl-config-field hitl-config-field--tools">
	                                                    <label class="hitl-config-label" for="hitl-sensitive-tools" data-i18n="chat.hitlWhitelistTools">白名单工具（免审批，逗号分隔）</label>
	                                                    <textarea id="hitl-sensitive-tools" class="hitl-config-textarea" rows="6" spellcheck="false" autocomplete="off" data-i18n="chat.hitlWhitelistPlaceholder" data-i18n-attr="placeholder" placeholder=""></textarea>
	                                                    <p class="hitl-config-hint" data-i18n="chat.hitlWhitelistHint">每行一个或逗号分隔；与 config 中全局白名单合并生效。</p>
	                                                </div>
	                                            </div>
	                                        </div>
	                                    </div>
	                                </div>
	                            </div>
	                        </aside>
                        
                        <!-- 对话界面 -->
                        <div class="chat-container">
                            <!-- 会话顶部栏（只在有会话选中时显示） -->
                            <div id="conversation-header" class="conversation-header" style="display: none;">
                                <div class="conversation-header-content">
                                    <button id="attack-chain-btn" class="attack-chain-btn" data-i18n="chat.viewAttackChain" data-i18n-attr="title" data-i18n-skip-text="true" title="查看攻击链" disabled>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M10.5 13.5l3-3M8 8H5a4 4 0 1 0 0 8h3m8-8h3a4 4 0 0 1 0 8h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                        <span data-i18n="chat.attackChain">攻击链</span>
                                    </button>
                                </div>
                            </div>
                            <div id="active-tasks-bar" class="active-tasks-bar"></div>
                            <div id="chat-messages" class="chat-messages"></div>
                            <nav id="chat-turn-rail" class="chat-turn-rail" aria-label="对话轮次导航" hidden>
                                <div id="chat-turn-rail-markers" class="chat-turn-rail-markers"></div>
                            </nav>
                            <div id="chat-turn-rail-preview" class="chat-turn-rail-preview" role="tooltip" hidden>
                                <div id="chat-turn-rail-preview-title" class="chat-turn-rail-preview-title"></div>
                                <div id="chat-turn-rail-preview-summary" class="chat-turn-rail-preview-summary"></div>
                            </div>
                            <button type="button" id="chat-return-latest" class="chat-return-latest" hidden
                                    data-i18n="chat.returnToLatest" data-i18n-attr="title,aria-label" data-i18n-skip-text="true"
                                    title="回到最新消息" aria-label="回到最新消息">
                                <span class="chat-return-latest-dots" aria-hidden="true">
                                    <span class="chat-return-latest-dot"></span>
                                    <span class="chat-return-latest-dot"></span>
                                    <span class="chat-return-latest-dot"></span>
                                </span>
                            </button>
                            <div id="agent-plan-progress" class="agent-plan-progress" hidden aria-live="polite"></div>
                            <div id="chat-input-container" class="chat-input-container">
                                <div class="chat-composer-context" aria-label="当前会话上下文">
                                <div class="chat-input-leading">
                                <div class="role-selector-wrapper project-selector-wrapper">
                                    <button type="button" id="chat-project-btn" class="role-selector-btn" onclick="toggleChatProjectPanel()" aria-label="选择项目" aria-haspopup="listbox" aria-expanded="false" title="绑定项目后共享事实黑板（跨对话）" data-i18n="projects.chatSelectorButton" data-i18n-attr="aria-label,title">
                                        <span class="role-selector-icon" aria-hidden="true">
                                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4l2 2h6A2.5 2.5 0 0 1 20.5 8.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-10z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                        <span id="chat-project-text" class="role-selector-text" data-i18n="projects.noProject">无项目</span>
                                        <svg class="role-selector-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                    <div id="chat-project-panel" class="role-selection-panel chat-project-panel" style="display: none;" role="listbox" aria-labelledby="chat-project-panel-title">
                                        <div class="role-selection-panel-header">
                                            <h3 id="chat-project-panel-title" class="role-selection-panel-title" data-i18n="projects.selectProject">选择项目</h3>
                                            <button type="button" class="role-selection-panel-close" onclick="closeChatProjectPanel()" title="关闭" aria-label="关闭">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                        </div>
                                        <div class="chat-project-panel-body">
                                            <div class="chat-project-panel-search">
                                                <input type="search" id="chat-project-search" class="chat-project-panel-search-input" autocomplete="off" data-i18n="projects.searchProjectsPlaceholder" data-i18n-attr="placeholder" placeholder="搜索项目…">
                                            </div>
                                            <div id="chat-project-list" class="role-selection-list-main"></div>
                                            <div class="chat-project-panel-footer">
                                                <button type="button" class="role-selection-item-main chat-project-panel-create-btn" data-require-permission="project:write" onclick="showNewProjectModalFromChat()">
                                                    <span class="chat-project-panel-create-icon" aria-hidden="true">+</span>
                                                    <span class="chat-project-panel-create-label" data-i18n="projects.newProject">新建项目</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="role-selector-wrapper" class="role-selector-wrapper">
                                    <button type="button" id="role-selector-btn" class="role-selector-btn" onclick="toggleRoleSelectionPanel()" data-i18n="chat.selectRole" data-i18n-attr="title" title="选择角色">
                                        <span id="role-selector-icon" class="role-selector-icon">🔵</span>
                                        <span id="role-selector-text" class="role-selector-text" data-i18n="chat.defaultRole">默认</span>
                                        <svg class="role-selector-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                    <!-- 角色选择下拉面板 -->
                                    <div id="role-selection-panel" class="role-selection-panel" style="display: none;">
                                        <div class="role-selection-panel-header">
                                            <h3 class="role-selection-panel-title" data-i18n="chat.rolePanelTitle">选择角色</h3>
                                            <button class="role-selection-panel-close" onclick="closeRoleSelectionPanel()" data-i18n="common.close" data-i18n-attr="title" title="关闭">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                        </div>
                                        <div id="role-selection-list" class="role-selection-list-main"></div>
                                    </div>
                                </div>
                                <div id="agent-mode-wrapper" class="agent-mode-wrapper" style="display: none;">
                                    <div class="agent-mode-inner">
                                        <button type="button" id="agent-mode-btn" class="role-selector-btn agent-mode-btn" onclick="toggleAgentModePanel()" data-i18n="chat.agentModeSelectAria" data-i18n-attr="aria-label,title" data-i18n-skip-text="true" aria-label="选择对话执行模式" aria-haspopup="listbox" aria-expanded="false" title="选择对话执行模式">
                                            <span id="agent-mode-icon" class="role-selector-icon agent-mode-logo agent-mode-logo--default" aria-hidden="true"><svg class="agent-mode-logo__svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01"/><path d="M16 16h.01"/></svg></span>
                                            <span id="agent-mode-text" class="role-selector-text">单代理</span>
                                            <svg class="role-selector-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <div id="agent-mode-panel" class="agent-mode-panel" style="display: none;" role="listbox" aria-labelledby="agent-mode-panel-title">
                                            <div class="role-selection-panel-header agent-mode-panel-header">
                                                <h3 id="agent-mode-panel-title" class="role-selection-panel-title" data-i18n="chat.agentModePanelTitle">对话模式</h3>
                                                <button type="button" class="role-selection-panel-close" onclick="closeAgentModePanel()" data-i18n="common.close" data-i18n-attr="title" title="关闭">
