{{define "mcp/management"}}
<div id="page-mcp-management" class="page">
                    <div class="page-header">
                        <h2 data-i18n="mcp.managementTitle">MCP 管理</h2>
                        <div class="page-header-actions">
                            <button class="btn-secondary" onclick="loadExternalMCPs()"><span data-i18n="common.refresh">刷新</span></button>
                        </div>
                    </div>
                    <div class="page-content">
                        <div class="mcp-management-layout">
                        <!-- MCP工具配置 -->
                        <div class="settings-section mcp-management-panel mcp-tools-panel" style="margin-bottom: 32px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <h3 style="margin: 0;" data-i18n="mcp.toolConfig">MCP 工具配置</h3>
                                <button class="btn-primary" data-require-permission="config:write" onclick="saveToolsConfig()" data-i18n="mcp.saveToolConfig">保存工具配置</button>
                            </div>
                            <div class="tools-controls mcp-panel-body">
                                <div class="tools-actions">
                                    <button class="btn-secondary" onclick="selectAllTools()" data-i18n="mcp.selectAll">全选</button>
                                    <button class="btn-secondary" onclick="deselectAllTools()" data-i18n="mcp.deselectAll">全不选</button>
                                    <div class="tools-status-filter">
                                        <button class="btn-filter active" data-filter="" onclick="filterToolsByStatus('')" data-i18n="mcp.filterAll">全部</button>
                                        <button class="btn-filter" data-filter="true" onclick="filterToolsByStatus('true')" data-i18n="mcp.filterEnabled">已启用</button>
                                        <button class="btn-filter" data-filter="false" onclick="filterToolsByStatus('false')" data-i18n="mcp.filterDisabled">已停用</button>
                                    </div>
                                    <div class="search-box">
                                        <input type="text" id="tools-search" data-i18n="mcp.toolSearchPlaceholder" data-i18n-attr="placeholder" placeholder="搜索工具..." onkeypress="handleSearchKeyPress(event)" oninput="if(this.value.trim() === '') clearSearch()" />
                                        <button class="btn-search" onclick="searchTools()" data-i18n="common.search" data-i18n-attr="title" title="搜索">🔍</button>
                                    </div>
                                    <div class="tools-stats" id="tools-stats"></div>
                                </div>
                                <div id="tools-list" class="tools-list"></div>
                            </div>
                        </div>

                        <!-- 外部MCP配置 -->
                        <div class="settings-section mcp-management-panel mcp-external-panel">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <h3 style="margin: 0;" data-i18n="mcp.externalConfig">外部 MCP 配置</h3>
                                <button class="btn-primary" data-require-permission="mcp:write" onclick="showAddExternalMCPModal()" data-i18n="mcp.addExternalMCP">添加外部MCP</button>
                            </div>
                            <div class="external-mcp-controls mcp-panel-body">
                                <div class="external-mcp-actions">
                                    <div class="external-mcp-stats" id="external-mcp-stats"></div>
                                </div>
                                <div id="external-mcp-list" class="external-mcp-list"></div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
{{end}}
