{{define "tools/modals"}}
<div id="tool-modal" class="modal" style="display: none;">
                    <div class="modal-content" style="max-width: 820px; max-height: 92vh;">
                        <div class="modal-header">
                            <h2 id="tool-modal-title" data-i18n="toolsPage.editTitle">工具配置</h2>
                            <span class="modal-close" onclick="closeToolModal()">&times;</span>
                        </div>
                        <div class="modal-body" style="overflow-y: auto; max-height: calc(92vh - 130px);">
                            <input type="hidden" id="tool-modal-name-current" value="">
                            <div class="form-group" id="tool-modal-name-row">
                                <label data-i18n="toolsPage.fieldName">工具名</label>
                                <input type="text" id="tool-modal-name" placeholder="my_tool" autocomplete="off" />
                            </div>
                            <div class="form-group">
                                <label data-i18n="toolsPage.fieldYAML">YAML 配置</label>
                                <textarea id="tool-modal-content" rows="20" spellcheck="false" style="font-family: monospace; width: 100%;"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-secondary" onclick="closeToolModal()" data-i18n="common.cancel">取消</button>
                            <button class="btn-primary" data-require-permission="config:write" onclick="saveToolConfig()" data-i18n="common.save">保存</button>
                        </div>
                    </div>
                </div>
{{end}}
