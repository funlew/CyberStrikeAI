{{define "vulnerabilities/modals"}}
<div id="vulnerability-retest-modal" class="modal">
        <div class="modal-content" style="max-width: 720px;">
            <div class="modal-header">
                <h2 data-i18n="vulnerabilityRetest.title">复测漏洞</h2>
                <button type="button" class="modal-close" onclick="closeAppModal('vulnerability-retest-modal')" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <p id="vulnerability-retest-title"></p>
                <p class="form-hint" data-i18n="vulnerabilityRetest.hint">每次确认都会从原始对话创建独立分支，继承原项目和历史，可继续多轮验证。</p>
                <div class="form-group">
                    <label for="vulnerability-retest-prompt" data-i18n="vulnerabilityRetest.promptLabel">复测提示词</label>
                    <textarea id="vulnerability-retest-prompt" rows="8" class="form-input"></textarea>
                    <p class="form-hint" data-i18n="vulnerabilityRetest.placeholderHint">占位符发送时自动替换，也支持在后续对话中手动输入。</p>
                </div>
                <p id="vulnerability-retest-error" role="alert"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeAppModal('vulnerability-retest-modal')" data-i18n="common.cancel">取消</button>
                <button type="button" id="vulnerability-retest-confirm" class="btn-primary" onclick="confirmVulnerabilityRetest()" data-i18n="vulnerabilityRetest.confirm">确认并开始复测</button>
            </div>
        </div>
    </div>

    <!-- 漏洞编辑模态框 -->
    <div id="vulnerability-modal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2 id="vulnerability-modal-title" data-i18n="vulnerability.addVuln">添加漏洞</h2>
                <span class="modal-close" onclick="closeVulnerabilityModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="vulnerability-project-id" data-i18n="vulnerabilityModal.project">所属项目</label>
                    <select id="vulnerability-project-id" class="form-input">
                        <option value="" data-i18n="vulnerabilityModal.projectNone">（未绑定）</option>
                    </select>
                    <p class="form-hint" data-i18n="vulnerabilityModal.projectHint">绑定后 Agent 在项目范围内可通过 list_vulnerabilities 看到本条记录；留空则尝试从会话自动关联。</p>
                </div>
                <div class="form-group">
                    <label for="vulnerability-conversation-id"><span data-i18n="vulnerabilityModal.conversationId">会话ID</span></label>
                    <input type="text" id="vulnerability-conversation-id" data-i18n="vulnerabilityModal.conversationIdPlaceholder" data-i18n-attr="placeholder" placeholder="可选：输入已有会话ID，留空可独立添加漏洞" />
                </div>
                <div class="form-group">
                    <label for="vulnerability-conversation-tag" data-i18n="vulnerabilityModal.conversationTag">对话标签</label>
                    <input type="text" id="vulnerability-conversation-tag" data-i18n="vulnerabilityModal.conversationTagPlaceholder" data-i18n-attr="placeholder" placeholder="如：红队演练A、客户A周报" />
                </div>
                <div class="form-group">
                    <label for="vulnerability-task-tag" data-i18n="vulnerabilityModal.taskTag">任务标签</label>
                    <input type="text" id="vulnerability-task-tag" data-i18n="vulnerabilityModal.taskTagPlaceholder" data-i18n-attr="placeholder" placeholder="如：批量扫描Q2、专项复测" />
                </div>
                <div class="form-group">
                    <label for="vulnerability-title"><span data-i18n="vulnerabilityModal.title">标题</span> <span style="color: red;">*</span></label>
                    <input type="text" id="vulnerability-title" data-i18n="vulnerabilityModal.titlePlaceholder" data-i18n-attr="placeholder" placeholder="/api/login 存在 SQL 注入" required />
                </div>
                <div class="form-group">
                    <label for="vulnerability-description"><span data-i18n="vulnerabilityModal.description">描述</span> <span style="color: red;">*</span></label>
                    <textarea id="vulnerability-description" rows="7" data-i18n="vulnerabilityModal.descriptionPlaceholder" data-i18n-attr="placeholder" placeholder="建议包含：摘要、测试环境与范围、前置条件、复现步骤、预期结果、实际结果。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-severity"><span data-i18n="vulnerabilityModal.severity">严重程度</span> <span style="color: red;">*</span></label>
                    <select id="vulnerability-severity" required>
                        <option value="" data-i18n="vulnerabilityModal.pleaseSelect">请选择</option>
                        <option value="critical" data-i18n="vulnerabilityModal.severityCritical">严重</option>
                        <option value="high" data-i18n="vulnerabilityModal.severityHigh">高危</option>
                        <option value="medium" data-i18n="vulnerabilityModal.severityMedium">中危</option>
                        <option value="low" data-i18n="vulnerabilityModal.severityLow">低危</option>
                        <option value="info" data-i18n="vulnerabilityModal.severityInfo">信息</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="vulnerability-status" data-i18n="vulnerabilityModal.status">状态</label>
                    <select id="vulnerability-status">
                        <option value="open" data-i18n="vulnerabilityModal.statusOpen">待处理</option>
                        <option value="confirmed" data-i18n="vulnerabilityModal.statusConfirmed">已确认</option>
                        <option value="fixed" data-i18n="vulnerabilityModal.statusFixed">已修复</option>
                        <option value="ignored" data-i18n="vulnerabilityModal.statusIgnored">已忽略</option>
                        <option value="false_positive" data-i18n="vulnerabilityModal.statusFalsePositive">误报</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="vulnerability-type"><span data-i18n="vulnerabilityModal.type">漏洞类型</span> <span style="color: red;">*</span></label>
                    <input type="text" id="vulnerability-type" data-i18n="vulnerabilityModal.typePlaceholder" data-i18n-attr="placeholder" placeholder="如：SQL注入、XSS、CSRF等" />
                </div>
                <div class="form-group">
                    <label for="vulnerability-target"><span data-i18n="vulnerabilityModal.target">目标</span> <span style="color: red;">*</span></label>
                    <input type="text" id="vulnerability-target" data-i18n="vulnerabilityModal.targetPlaceholder" data-i18n-attr="placeholder" placeholder="精确到 URL/IP:端口/接口路径/参数名" />
                </div>
                <div class="form-group">
                    <label for="vulnerability-preconditions" data-i18n="vulnerabilityModal.preconditions">前置条件</label>
                    <textarea id="vulnerability-preconditions" rows="3" data-i18n="vulnerabilityModal.preconditionsPlaceholder" data-i18n-attr="placeholder" placeholder="登录状态、权限、账号、Header/Cookie、特定数据、环境/版本；无则写无。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-reproduction-steps"><span data-i18n="vulnerabilityModal.reproductionSteps">复现步骤</span> <span style="color: red;">*</span></label>
                    <textarea id="vulnerability-reproduction-steps" rows="6" data-i18n="vulnerabilityModal.reproductionStepsPlaceholder" data-i18n-attr="placeholder" placeholder="按 1/2/3 编号，写清入口、参数、payload、执行命令、观察点。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-evidence"><span data-i18n="vulnerabilityModal.evidence">证据 / POC</span> <span style="color: red;">*</span></label>
                    <textarea id="vulnerability-evidence" rows="8" data-i18n="vulnerabilityModal.evidencePlaceholder" data-i18n-attr="placeholder" placeholder="原始请求/响应、curl/工具命令、截图说明、日志、DNSLog/回连记录、数据库结果、文件路径、时间戳等。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-impact"><span data-i18n="vulnerabilityModal.impact">影响</span> <span style="color: red;">*</span></label>
                    <textarea id="vulnerability-impact" rows="3" data-i18n="vulnerabilityModal.impactPlaceholder" data-i18n-attr="placeholder" placeholder="结合已验证事实说明实际影响，例如越权读取哪些数据。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-recommendation"><span data-i18n="vulnerabilityModal.recommendation">修复建议</span> <span style="color: red;">*</span></label>
                    <textarea id="vulnerability-recommendation" rows="3" data-i18n="vulnerabilityModal.recommendationPlaceholder" data-i18n-attr="placeholder" placeholder="写具体修复点和复测标准。"></textarea>
                </div>
                <div class="form-group">
                    <label for="vulnerability-retest-notes" data-i18n="vulnerabilityModal.retestNotes">复测方式</label>
                    <textarea id="vulnerability-retest-notes" rows="3" data-i18n="vulnerabilityModal.retestNotesPlaceholder" data-i18n-attr="placeholder" placeholder="修复后如何验证漏洞已关闭，包括应返回的状态码、错误信息或访问控制结果。"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeVulnerabilityModal()" data-i18n="common.cancel">取消</button>
                <button class="btn-primary" data-require-permission="vulnerability:write" onclick="saveVulnerability()" data-i18n="common.save">保存</button>
            </div>
        </div>
    </div>
{{end}}
